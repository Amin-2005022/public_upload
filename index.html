<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public files</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #64717d;
      --paper: #f5f7f8;
      --line: #dce3e8;
      --accent: #0b6e69;
      --accent-dark: #07514e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, #eef7f5 0%, var(--paper) 46%, #f8f1e8 100%);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 12vh 0 64px;
    }

    header { margin-bottom: 32px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font: 700 12px/1.2 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 600px;
      font-size: clamp(38px, 8vw, 72px);
      line-height: 0.98;
      font-weight: 400;
    }

    .intro {
      max-width: 520px;
      margin: 18px 0 0;
      color: var(--muted);
      font: 17px/1.55 Arial, sans-serif;
    }

    .files {
      display: grid;
      gap: 12px;
    }

    .file {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 8px 24px rgba(23, 33, 43, 0.05);
    }

    .file-name {
      overflow-wrap: anywhere;
      font-size: 20px;
      line-height: 1.25;
    }

    .file-type {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font: 12px/1.2 Arial, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .download {
      flex: 0 0 auto;
      padding: 11px 15px;
      color: #fff;
      background: var(--accent);
      font: 700 13px/1 Arial, sans-serif;
      text-decoration: none;
    }

    .download:hover, .download:focus-visible { background: var(--accent-dark); }

    @media (max-width: 520px) {
      main { padding-top: 64px; }
      .file { align-items: flex-start; flex-direction: column; }
      .download { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Shared materials</p>
      <h1>Public files</h1>
      <p class="intro">Open or download the available documents below.</p>
    </header>

    <section class="files" aria-label="Available files">
      <article class="file">
        <div>
          <div class="file-name">Lecture 1 – Introduction to Computer Graphics.pdf</div>
          <span class="file-type">PDF document</span>
        </div>
        <a class="download" href="Lecture%201%20%E2%80%93%20Introduction%20to%20Computer%20Graphics.pdf" download>Download</a>
      </article>
    </section>
  </main>
</body>
</html>
